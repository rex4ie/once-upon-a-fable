plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def vName = System.getenv('APP_VERSION') ?: '1.0'
def vParts = vName.tokenize('.').collect { it as int } + [0, 0]
android {
  namespace 'com.rez4ie.fables'
  compileSdk 34
  defaultConfig {
    applicationId 'com.rez4ie.fables'
    minSdk 24
    targetSdk 34
    versionName vName
    versionCode vParts[0] * 10000 + vParts[1] * 100 + vParts[2]
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('KEYSTORE_FILE') ?: 'none.p12')
      storeType 'pkcs12'
      storePassword System.getenv('KEYSTORE_PASSWORD')
      keyAlias System.getenv('KEY_ALIAS')
      keyPassword System.getenv('KEYSTORE_PASSWORD')
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.release }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
}
dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
  implementation 'androidx.core:core-ktx:1.13.1'
}

name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Bundle story text into the app
        run: |
          mkdir -p android/app/src/main/assets/www/content/lessons
          cp content/index.json content/licences.json android/app/src/main/assets/www/content/
          cp content/lessons/*.json android/app/src/main/assets/www/content/lessons/
      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: fables
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.p12" APP_VERSION="$V"
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk "OnceUponAFable-$V.apk"
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES="notes/$V.md"; [ -f "$NOTES" ] || { echo "Improvements and fixes." > /tmp/n.md; NOTES=/tmp/n.md; }
          gh release create "$GITHUB_REF_NAME" "OnceUponAFable-$V.apk" --title "$V" --notes-file "$NOTES"
